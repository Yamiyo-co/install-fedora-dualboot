# version=44
# Fedora 44 Kickstart
# Author: Lilian POULIQUEN
#
# Lines to modify : 17, 57 and 61. | Please, check your own disk name and parts before running.

# Use command line install
text

# Keyboard layouts
keyboard --xlayouts="fr (oss)"

# System language
lang fr_FR.UTF-8

# Network information
network --bootproto=dhcp --onboot=yes --ipv6=auto --hostname=HOSTNAME

# Do not run the Setup Agent on first boot
firstboot --disable

# Ensure only needed storages
ignoredisk --only-use=nvme0n1,nme1n1

# Erase / Write only on Linux parts and protect Windows. | --list used to precise Linux disk parts.
clearpart --disk=nvme0n1,nme1n1 --list=nvme0n1p5,nvme0n1p6,nvme1n1p1

# Use current EFI part without erasing or rewriting it
part /boot/efi --fstype="efi" --onpart=nvme0n1p1 --noformat

# New part /boot on nvme0n1
part /boot --fstype="ext4" --onedisk=nvme0n1 --size=2048

# === ROOT -> nvme0n1 (share disk with Windows) ===
# set logvol first line on --size=1 --grow if you want to use the whole disk at once.
# Else, keep the line and do snapshot or mount another volume later.
part pv.1000 --fstype="lvmpv" --onedisk=nvme0n1 --size=1 --grow --encrypted --luks-version=luks2
volgroup LinuxSystem --pesize=4096 pv.1000
logvol / --fstype="xfs" --size=32000 --label="LinuxSystem" --name=root --vgname=LinuxSystem
logvol swap --fstype="swap" --size=8192 --name=swap --vgname=LinuxSystem

# === HOME -> nvme1n1 ===
part pv.1001 --fstype="lvmpv" --ondisk=nvme1n1 --size=1 --grow --encrypted --luks-version=luks2
volgroup LinuxData --pesize=4096 pv.1001
logvol /home --fstype="xfs" --size=1 --grow --label="LinuxData" --name=home --vgname=LinuxData

# Bootloader UEFI
bootloader --boot-drive=nvme0n1

# System timezone
timezone Europe/Paris

# Adding repos
url --mirrorlist="https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=x86_64"

# Root password
rootpw --iscrypted ENCRYPTED_ROOT_PASSWORD

# Create main user
# Don't forget to also add the username on postinstall section (line 145) 
user --groups=wheel --name=MAIN_USER_LOGIN --password=ENCRYPTED_MAIN_USER_PASSWORD --iscrypted --gecos="MAIN_USER_DISPLAY_NAME"

# Enabling services
services --enabled=libvirtd

# Interface graphique au démarrage
xconfig --startxonboot

# Shutdown after installation
shutdown

%addon com_redhat_kdump --disable --reserve-mb='auto'

%end

# Installing packages
%packages
@^workstation-product-environment
@virtualization

