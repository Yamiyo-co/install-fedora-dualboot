## Installing packages
ansible
ansible-lint
bridge-utils
flatpak
gcc-c++
gnome-shell-extension-blur-my-shell
gnome-shell-extension-common
gnome-shell-extension-drive-menu
gnome-shell-extension-launch-new-instance
gnome-shell-extension-no-overview
gnome-shell-extension-user-theme
gnome-tweaks
java-latest-openjdk
neovim
npm
tig
tmux
vim

%end

# Post installs
%post --interpreter=/usr/bin/bash --log=/root/ks-post-script.log

CREATED_USER="MAIN_USER_LOGIN"
INSTALL_FEDORA_VERSION=44.1

## Download post-install scripts
echo "Downloading post-install scripts"
wget --quiet --output-document "/tmp/${INSTALL_FEDORA_VERSION}.tar.gz" "https://github.com/lilian-pouliquen/install-fedora/archive/refs/tags/${INSTALL_FEDORA_VERSION}.tar.gz"

## Extract scripts
echo "Extracting post-install"
tar --directory "/tmp/" --extract --overwrite --file="/tmp/${INSTALL_FEDORA_VERSION}.tar.gz"

# Create required directories
echo "Creating required directories"
mkdir --parents \
    "/etc/skel/post-install/" \
    "/home/${CREATED_USER}/post-install/"

# Deploy post-install scripts to exisiting user and future ones
echo "Deploying post-install scripts"
echo "    - /etc/skel/post-install/"
cp -r \
    "/tmp/install-fedora-${INSTALL_FEDORA_VERSION}/postinstall-fedora.sh" \
    "/tmp/install-fedora-${INSTALL_FEDORA_VERSION}/configure/" \
    "/tmp/install-fedora-${INSTALL_FEDORA_VERSION}/files/" \
    "/etc/skel/post-install/"

echo "    - /home/${CREATED_USER}/post-install/"
cp -r \
    "/tmp/install-fedora-${INSTALL_FEDORA_VERSION}/postinstall-fedora.sh" \
    "/tmp/install-fedora-${INSTALL_FEDORA_VERSION}/configure/" \
    "/tmp/install-fedora-${INSTALL_FEDORA_VERSION}/files/" \
    "/home/${CREATED_USER}/post-install/"

# Apply permissions
echo "Applying permissions"
echo "    - /etc/skel/post-install/"
chmod 755 \
    /etc/skel/post-install/configure/install-configs.sh \
    /etc/skel/post-install/postinstall-fedora.sh

echo "    - /home/${CREATED_USER}/post-install/"
chown -R "${CREATED_USER}:${CREATED_USER}" "/home/${CREATED_USER}/post-install/"
chmod 755 \
    "/home/${CREATED_USER}/post-install/postinstall-fedora.sh" \
    "/home/${CREATED_USER}/post-install/configure/install-configs.sh"

%end

