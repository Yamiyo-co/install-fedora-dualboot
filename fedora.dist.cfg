-gnome-calculator
-gnome-calendar
-gnome-characters
-gnome-classic-session
-gnome-clocks
-gnome-connections
-gnome-contacts
-gnome-epub-thumbnailer
-gnome-extensions-app
-gnome-font-viewer
-gnome-initial-setup
-gnome-logs
-gnome-maps
-gnome-shell-extension-background-logo
-gnome-text-editor
-gnome-tour
-gnome-user-docs
-gnome-weather
-libreoffice*
-loupe
